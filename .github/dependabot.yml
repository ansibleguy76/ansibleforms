version: 2

# npm packages are NOT watched here, on purpose : client and server dependencies are
# updated by hand (npm outdated, read the changelogs, decide), so that no breaking change
# arrives through a pull request that looks routine. Known vulnerabilities in them are
# still reported, as Dependabot security alerts on the Security tab.
#
# Every pull request title here must pass the PR / Title check (Conventional Commits), so
# each entry sets a commit-message prefix : ci for the workflow actions, build(deps) for
# the docker images. `build` is hidden in the generated CHANGELOG.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  # Moves the digest pin on ansibleforms-base in Dockerfile when .github/workflows/base.yml
  # publishes a new base image. Dockerfile.base (node) is watched too.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: build
      include: scope
