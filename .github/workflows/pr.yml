name: PR

# Pull requests are squash-merged, and the squash commit takes the PR TITLE as its message.
# That title is what release-please reads to pick the next version and to write the
# CHANGELOG line, so it has to be a Conventional Commit : `feat: ...` is a minor release,
# `fix: ...` a patch, `feat!: ...` or a `BREAKING CHANGE:` footer a major. See CONTRIBUTING.md.
#
# No secrets and a read-only token, so these run on pull requests from forks as well.
# The job names are required checks in the main ruleset - renaming one breaks that rule.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  pull-requests: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            revert
            security
            docs
            test
            ci
            chore
            build
            style
          # "fix: Something" reads badly as a changelog line next to "fix: something"
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" of the title "{title}" should start with a lowercase letter.

  branch:
    name: Branch
    runs-on: ubuntu-latest
    steps:
      - name: Branch name has a type prefix
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          types='feat|fix|perf|refactor|revert|security|docs|test|ci|chore|build|style'
          # dependabot and release-please name their own branches
          if [[ "$BRANCH" =~ ^($types)/.+ || "$BRANCH" =~ ^dependabot/.+ || "$BRANCH" =~ ^release-please--.+ ]]; then
            echo "branch '$BRANCH' is fine"
            exit 0
          fi
          echo "::error::branch '$BRANCH' should be named <type>/<short-description>, with type one of: ${types//|/, } - for example fix/ldap-group-filter"
          exit 1

  # The CHANGELOG is written by release-please from the pull request titles. A hand edit
  # in a feature pull request would either be duplicated by the generated line or land
  # outside any version section - which is how the old [Unreleased] heading went wrong.
  changelog:
    name: Changelog untouched
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: CHANGELOG.md is not edited by hand
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE...$HEAD" | grep -qx 'CHANGELOG.md'; then
            echo "::error::CHANGELOG.md is generated from the pull request title on release - leave it out of this pull request and put the wording in the title instead"
            exit 1
          fi
          echo "CHANGELOG.md untouched"
