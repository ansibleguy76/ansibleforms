name: Release

# release-please keeps ONE open pull request, "chore: release x.y.z", up to date with every
# merge into main : it computes the next version from the Conventional Commit titles of the
# squashed pull requests, bumps server/package.json and writes the CHANGELOG section.
# Merging that pull request is the release : this same workflow then creates the tag and
# the GitHub release, and publishes the image as x.y.z and latest.
#
# The token comes from a GitHub App (or PAT_TOKEN until the App exists), not GITHUB_TOKEN. A pull request opened with
# GITHUB_TOKEN starts no workflows, so the release pull request would never get its
# required checks and could never be merged. See RELEASING.md for the App setup.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # the App once RELEASE_APP_ID is set, PAT_TOKEN until then - see RELEASING.md
      - uses: actions/create-github-app-token@v3
        id: app
        if: vars.RELEASE_APP_ID != ''
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ steps.app.outputs.token || secrets.PAT_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
      ref: ${{ needs.release-please.outputs.tag_name }}
      channel: release
    secrets: inherit
