name: Publish

# Builds and pushes the application image. Called by release.yml when a release is created
# (x.y.z + latest) and by rc.yml for a release candidate (x.y.z-rc.<pr>.<run> + latest-rc).
# "Run workflow" re-publishes an existing release tag, for when a push failed half way.
#
# It pushes to GHCR always and to Docker Hub when the secret is there. Docker Hub stays
# the canonical channel - docs/installation.md tells people to pull ansibleguy/ansibleforms
# and every deployment in the wild points at it - so GHCR is a mirror beside it, not a
# replacement. To drop Docker Hub one day, delete its login step and its tags.
#
# It does not commit anything. CI fails a pull request whose server/schema/public is stale,
# so by the time something is published that copy is correct.

on:
  workflow_call:
    inputs:
      version:
        description: 'The version the image is tagged with and reports in the UI'
        type: string
        required: true
      ref:
        description: 'The commit, branch or tag to build'
        type: string
        required: true
      channel:
        description: 'release (x.y.z + latest) or rc (x.y.z-rc.n + latest-rc)'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing release tag to publish again, e.g. 6.3.1'
        type: string
        required: true

permissions:
  contents: read
  packages: write   # GHCR, through the automatic GITHUB_TOKEN - no secret needed

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    environment: dockerhub
    # one publish per version at a time ; a newer rc run for the same pull request waits
    concurrency:
      group: publish-${{ inputs.version || inputs.tag }}
      cancel-in-progress: false
    env:
      VERSION: ${{ inputs.version || inputs.tag }}
      REF: ${{ inputs.ref || inputs.tag }}
      CHANNEL: ${{ inputs.channel || 'release' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.REF }}

      - name: Read the build facts
        id: v
        run: |
          case "$CHANNEL" in release|rc) ;; *) echo "::error::unknown channel '$CHANNEL'"; exit 1 ;; esac
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          # short, not the full sha : generate-build-info.sh writes GIT_SHA verbatim into
          # build-info.json and the About dialog has always shown the short form
          echo "sha_short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION ($CHANNEL) from $(git rev-parse HEAD)"

      # A release must be built from a commit whose manifest names that release, or the
      # image, the tag and a local build of the tag would describe different versions.
      # release-please guarantees it ; this makes a hand-run re-publish prove it too.
      - name: Check the manifest matches the release
        if: env.CHANNEL == 'release'
        run: |
          manifest=$(jq -r .version server/package.json)
          if [ "$manifest" != "$VERSION" ]; then
            echo "::error::server/package.json says '$manifest' at $REF, not '$VERSION'"
            exit 1
          fi
          echo "manifest and release agree on $VERSION"

      # Docker Hub is optional, GHCR is not. When the secret is absent the Docker Hub
      # login and its tags are left out rather than failing the job.
      - name: Is Docker Hub configured?
        id: hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_TOKEN is not set - publishing to GHCR only"
          fi

      - name: Work out the tags
        id: tags
        run: |
          # github.repository is already lowercase here ; GHCR rejects anything else
          ghcr="ghcr.io/${{ github.repository }}"
          hub="${{ vars.DOCKERHUB_REPOSITORY || 'ansibleguy/ansibleforms' }}"
          if [ "$CHANNEL" = "rc" ]; then moving="latest-rc"; else moving="latest"; fi

          tags="$ghcr:$VERSION,$ghcr:$moving"
          if [ "${{ steps.hub.outputs.enabled }}" = "true" ]; then
            tags="$tags,$hub:$VERSION,$hub:$moving"
          fi
          echo "list=$tags" >> "$GITHUB_OUTPUT"
          echo "$tags" | tr ',' '\n'

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # VERSION is baked into build-info.json, which /api/v2/version prefers over
      # server/package.json - that is how a release candidate shows its own version
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            GIT_SHA=${{ steps.v.outputs.sha_short }}
            BUILD_TIME=${{ steps.v.outputs.build_time }}
            VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published $VERSION ($CHANNEL)"
            echo ""
            echo '```'
            echo "${{ steps.tags.outputs.list }}" | tr ',' '\n'
            echo '```'
            echo ""
            echo "from \`$(git rev-parse HEAD)\`"
          } >> "$GITHUB_STEP_SUMMARY"
