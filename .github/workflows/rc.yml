name: Release candidate

# Put the `release-candidate` label on a pull request and every push to it publishes an
# image to test before merging :
#
#   <next version>-rc.<pr number>.<run number>   e.g. 6.4.0-rc.512.7
#   latest-rc                                    always the most recent candidate
#
# The next version is the one this pull request would release. On the release pull
# request itself server/package.json already holds it (its tag does not exist yet) ;
# on any other pull request it is the last release, bumped by the type in the PR title.
#
# Only pull requests from a branch of THIS repository. A fork's code never runs with the
# Docker Hub secret, and only someone with write access can set the label.

on:
  pull_request:
    types: [labeled, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rc-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  version:
    name: Version
    if: >-
      contains(github.event.pull_request.labels.*.name, 'release-candidate') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'release-candidate')
    runs-on: ubuntu-latest
    outputs:
      rc: ${{ steps.v.outputs.rc }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Work out the candidate version
        id: v
        env:
          TITLE: ${{ github.event.pull_request.title }}
          PR: ${{ github.event.pull_request.number }}
          RUN: ${{ github.run_number }}
        run: |
          base=$(jq -r .version server/package.json)
          if ! git rev-parse -q --verify "refs/tags/$base" >/dev/null; then
            # not released yet : this is the release pull request, the bump is already in
            next="$base"
          else
            IFS=. read -r major minor patch <<< "$base"
            if [[ "$TITLE" =~ ^[a-z]+(\([^\)]*\))?!: ]] || [[ "$TITLE" == *"BREAKING"* ]]; then
              next="$((major + 1)).0.0"
            elif [[ "$TITLE" =~ ^feat(\([^\)]*\))?: ]]; then
              next="$major.$((minor + 1)).0"
            else
              next="$major.$minor.$((patch + 1))"
            fi
          fi
          rc="$next-rc.$PR.$RUN"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "release candidate $rc (last release $base)"

  publish:
    name: Publish
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.version.outputs.rc }}
      ref: ${{ github.event.pull_request.head.sha }}
      channel: rc
    secrets: inherit

  comment:
    name: Comment
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: release-candidate
          message: |
            ### Release candidate `${{ needs.version.outputs.rc }}`

            ```
            docker pull ansibleguy/ansibleforms:${{ needs.version.outputs.rc }}
            docker pull ghcr.io/${{ github.repository }}:${{ needs.version.outputs.rc }}
            ```

            Also tagged `latest-rc`. Built from ${{ github.event.pull_request.head.sha }}.
            Every push to this pull request publishes a new candidate while the label is on.
