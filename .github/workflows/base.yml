name: Base image

# ansibleguy/ansibleforms-base holds what the application runs ON - node, python, ansible,
# the os packages - and is versioned independently of the application : by build date,
# never by the app's semver.
#
#   <date>           e.g. 2026.10.01 (a second build that day gets -<run number>)
#   latest
#
# The base exists to make application builds fast, so it changes rarely and only on
# purpose : when Dockerfile.base changes on main (a new python or ansible version), or
# from Actions -> Base image -> Run workflow. Never on a schedule, and not when this
# workflow file itself is edited - that rebuilt the base three times in one day.
#
# The application Dockerfile pins the base by DIGEST, so publishing here changes nothing
# by itself. Dependabot (the docker entry in .github/dependabot.yml) notices the new digest
# behind :latest and opens a pull request that moves the pin - that pull request is where
# a base update is reviewed, tested (build a release candidate of it) and released.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.base'

permissions:
  contents: read
  packages: write

concurrency:
  group: base
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    environment: dockerhub
    steps:
      - uses: actions/checkout@v7

      - name: Is Docker Hub configured?
        id: hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_TOKEN is not set - publishing to GHCR only"
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out the tags
        id: tags
        run: |
          ghcr="ghcr.io/${{ github.repository }}-base"
          hub="${{ vars.DOCKERHUB_BASE_REPOSITORY || 'ansibleguy/ansibleforms-base' }}"
          date=$(date -u +%Y.%m.%d)
          # immutable per build : a same-day rebuild must not overwrite the earlier one.
          # Runs after the logins, so a private package is found as well.
          if docker manifest inspect "$ghcr:$date" >/dev/null 2>&1; then
            date="$date-${{ github.run_number }}"
          fi
          tags="$ghcr:$date,$ghcr:latest"
          if [ "${{ steps.hub.outputs.enabled }}" = "true" ]; then
            tags="$tags,$hub:$date,$hub:latest"
          fi
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "list=$tags" >> "$GITHUB_OUTPUT"
          echo "$tags" | tr ',' '\n'

      # no cache : the point of a rebuild is fresh packages
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64
          push: true
          no-cache: true
          tags: ${{ steps.tags.outputs.list }}

      - name: Summary
        run: |
          {
            echo "### Base image ${{ steps.tags.outputs.date }}"
            echo ""
            echo '```'
            echo "${{ steps.tags.outputs.list }}" | tr ',' '\n'
            echo '```'
            echo ""
            echo "digest \`${{ steps.build.outputs.digest }}\` - Dependabot will propose the pin update in Dockerfile"
          } >> "$GITHUB_STEP_SUMMARY"
