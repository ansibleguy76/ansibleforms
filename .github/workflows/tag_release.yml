name: Tag Release
on:
    push:
        branches: [ main ]
permissions:
  contents: write

jobs:
    tag_release:
        runs-on: ubuntu-latest
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

        steps:
            - name: Check out code
              uses: actions/checkout@v4
            - name: Initialize mandatory git config
              run: |
                  git config user.name "GitHub Actions"
                  git config user.email noreply@github.com
            - name: Setup release information
              run: |
                  versionName=$(sed '2q;d' app_versions.gradle | cut -d "=" -f2 | xargs)
                  echo "VERSION_NAME=$versionName" >> $GITHUB_ENV
            - name: Extract release notes
              id: extract_release_notes
              run: |
                # Extract content between first two version headers in CHANGELOG.md
                NOTES=$(awk '/^## \[/{if(n++)exit}n' CHANGELOG.md | tail -n +2)
                echo "release_notes<<EOF" >> $GITHUB_OUTPUT
                echo "$NOTES" >> $GITHUB_OUTPUT
                echo "EOF" >> $GITHUB_OUTPUT
            - name: Create Release
              env:
                GH_TOKEN: ${{ secrets.PAT_TOKEN }}
              run: |
                gh release create "${{ env.VERSION_NAME }}" \
                  --title "v${{ env.VERSION_NAME }}" \
                  --notes "${{ steps.extract_release_notes.outputs.release_notes }}"
