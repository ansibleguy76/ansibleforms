# Config seed, applied by the worker at every start (CONFIG_SEED_PATH in .env). It declares the
# rte container of compose.yaml as the default runner, so playbook forms run there, signing in
# with the credential below. The app dials the RTE (RTE_MODE=inbound) over one WebSocket : the RTE
# holds no database credentials. Objects declared here are read-only in the interface ; see
# https://ansibleforms.com/seed/ and https://ansibleforms.com/rte/modes.html
version: 1
credentials:
  items:
    - name: rte
      credential_type: rte
      description: The RTE_TOKEN of the rte container of compose.yaml, and its address
      url: http://rte:8000
      password: ${RTE_TOKEN}
runners:
  items:
    - name: rte
      type: rte
      rte_mode: inbound
      description: The rte container of compose.yaml
      credential: rte
      is_default: true
